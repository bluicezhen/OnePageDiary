services:
  server:
    build: ./server
    ports:
      - "8080:8080"
    environment:
      APP_ADDR: ":8080"
      APP_DB_PATH: "/data/diary.db"
      APP_ADMIN_USER: "admin"
      APP_ADMIN_PASS: "admin"
      APP_JWT_SECRET: "change-me"
      APP_CORS_ORIGINS: "*"
    volumes:
      - ./data:/data
  web:
    build: ./web
    ports:
      - "8081:80"
    depends_on:
      - server
